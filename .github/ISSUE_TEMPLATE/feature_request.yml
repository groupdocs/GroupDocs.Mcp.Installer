name: Feature request
description: Propose a new client, switch, or workflow for the installer
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The setup/verification/removal task — not the implementation. E.g. "register into JetBrains Rider", "verify with my own document per product".
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New AI client target
        - Installer behaviour / switches
        - Verification
        - Uninstall / cleanup
        - New GroupDocs product (manifest)
        - Other
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behaviour (optional)
